<!doctype html>
<html
  dir="ltr"
  lang="en"
>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0"
    />
    <title>Albe test application</title>
    <link
      rel="stylesheet"
      type="text/css"
      href="/build/web-components-library.css"
    />
    <script
      type="module"
      src="/build/web-components-library.esm.js"
    ></script>
    <script
      nomodule
      src="/build/web-components-library.js"
    ></script>
  </head>
  <body>
    <main style="padding-top: 40px">
      <div class="z-carousel-story-container">
        <z-stepper>
          <z-stepper-item
            index="1"
            checked
            href="stepper-1.html"
          >
            I tuoi dati
          </z-stepper-item>
          <z-stepper-item
            index="2"
            pressed
            href="stepper-2.html"
          >
            Le tue credenziali
          </z-stepper-item>
          <z-stepper-item
            index="3"
            disabled
            href="stepper-3.html"
          >
            Conferma
          </z-stepper-item>
        </z-stepper>
      </div>

      <form style="display: flex; flex-direction: column; gap: 20px; margin-top: 40px; padding: 0 20px">
        <z-input
          id="username"
          label="Nome utente"
          placeholder="Inserisci il tuo nome utente"
        ></z-input>
        <z-input
          id="password"
          label="Password"
          placeholder="Inserisci la tua password"
          type="password"
        ></z-input>
        <z-button
          type="submit"
          variant="primary"
          disabled
        >
          Avanti
        </z-button>
      </form>
    </main>
    <script>
      const usernameInput = document.getElementById("username");
      const passwordInput = document.getElementById("password");
      const submitButton = document.querySelector('z-button[type="submit"]');
      const stepperItems = Array.from(document.querySelectorAll("z-stepper-item"));

      const currentStep = Number(window.location.pathname.match(/stepper-(\d+)\.html/)?.[1] ?? 1);
      const maxStep = Math.max(currentStep, Number(sessionStorage.getItem("maxStep")) || 1);

      function syncStepper() {
        stepperItems.forEach((item) => {
          const index = Number(item.getAttribute("index"));
          item.toggleAttribute("pressed", index === currentStep);
          item.toggleAttribute("checked", index !== currentStep && index <= maxStep);
          item.toggleAttribute("disabled", index > maxStep);
        });
      }

      function checkInputs() {
        const isValid = Boolean(usernameInput.value.trim() && passwordInput.value.trim());
        submitButton.disabled = !isValid;
        const nextItem = document.querySelector(`z-stepper-item[index="${currentStep + 1}"]`);
        if (nextItem && currentStep + 1 > maxStep) {
          nextItem.toggleAttribute("disabled", !isValid);
        }
      }

      syncStepper();

      customElements.whenDefined("z-input").then(() => {
        usernameInput.value = sessionStorage.getItem("username") ?? "";
        passwordInput.value = sessionStorage.getItem("password") ?? "";
        checkInputs();
      });

      usernameInput.addEventListener("input", checkInputs);
      passwordInput.addEventListener("input", checkInputs);

      submitButton.addEventListener("click", (event) => {
        event.preventDefault();
        sessionStorage.setItem("username", usernameInput.value.trim());
        sessionStorage.setItem("password", passwordInput.value.trim());
        sessionStorage.setItem("maxStep", String(Math.max(currentStep + 1, maxStep)));
        window.location.href = `stepper-${currentStep + 1}.html`;
      });
    </script>
  </body>
  <style>
    body {
      margin: 0;
    }
  </style>
</html>
